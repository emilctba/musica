<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beats by @emilctba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Estilizando um pouco o player nativo para não destoar muito */
        audio { filter: invert(100%) hue-rotate(180deg) brightness(1.5) contrast(1.2); }
    </style>
</head>
<body class="pb-16 flex flex-col min-h-screen">

    <header class="sticky top-0 z-40 bg-black/95 backdrop-blur-md border-b border-white/10 pt-6 pb-4 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between mb-4">
                <span class="text-[12px] font-bold tracking-[0.3em] uppercase opacity-60">‹ AUDIO PLAYER</span>
                <span class="text-xl">🎵</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <h2 class="text-3xl font-extrabold text-white mb-8 border-b border-white/10 pb-4 tracking-tight">Minhas Tracks</h2>
        <div id="feed" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </main>

    <footer class="mt-auto py-8 border-t border-white/10 text-center bg-[#0a0a0a]">
        <p class="text-white/15 font-bold tracking-widest text-sm uppercase"><span class="text-white">@emilctba</span></p>
    </footer>

    <script>
        // Array com os seus áudios
        const data = [
            {
                n: "Ocarina of Time",
                d: "Zelda Soundtrack (zelda1.mp3)",
                url: "./zelda1.mp3",
                img: "logo.avif" 
            },
            {
                n: "Batida na porta efeito sonoro",
                d: "Efeito Sonoro (tum tum tum.wav)",
                url: "./tum-tum-tum.wav",
                img: "logo.avif"
            }
        ];

        const feed = document.getElementById('feed');

        function renderTracks() {
            let html = '';
            data.forEach((item) => {
                html += `
                <div class="w-full relative group bg-[#0a0a0a] rounded-3xl p-4 border border-white/5 hover:border-white/20 hover:bg-[#111] transition-all shadow-lg flex flex-col justify-between">
                    
                    <div class="w-full relative overflow-hidden bg-black rounded-2xl mb-4 shadow-md border border-white/5 h-48 sm:h-56">
                        <img src="${item.img}" class="w-full h-full object-cover opacity-60 group-hover:scale-110 transition-transform duration-500" loading="lazy">
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-start gap-3 mb-2">
                            <h3 class="text-[16px] font-extrabold text-white leading-tight pr-2 group-hover:text-gray-300 transition-colors">${item.n}</h3>
                        </div>
                        <p class="text-[13px] text-gray-400 leading-relaxed mb-5">${item.d}</p>
                        
                        <audio controls class="w-full h-10">
                            <source src="${item.url}" type="audio/mpeg">
                            Seu navegador não suporta o elemento de áudio.
                        </audio>
                    </div>
                </div>
                `;
            });
            feed.innerHTML = html;
        }

        renderTracks();
    </script>
</body>
</html>
